# SonarCloud 伺服器網址
sonar.host.url=https://sonarcloud.io

# -------------------------------------------------------------
# 請修改以下兩個欄位為你專案的實際數值 (可在專案的右下角 Information 找到)
# -------------------------------------------------------------
sonar.organization=marvin-hsu
sonar.projectKey=tsp-asyncapi

# 專案名稱與版號 (可選)
sonar.projectName=tsp-asyncapi
sonar.projectVersion=1.0.0

# 指定要掃描的原始碼目錄。兩個套件都在 packages/ 底下。
sonar.sources=packages

# 排除測試工具與建置產物。dist/ 是 src/ 的翻譯結果，掃它等於重複計算。
sonar.exclusions=packages/*/src/testing/**,packages/*/dist/**

# 設定覆蓋率報告路徑
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# 讓 SonarScanner 使用 Node.js 的 TypeScript 分析
sonar.javascript.environments=node
