name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets a run be started by hand. Needed whenever the last push already
  # happened and the result has to be produced again, such as after the
  # workflow was disabled and re-enabled.
  workflow_dispatch:

# A second push to the same branch makes the first run pointless. Without
# this, both run to completion and compete for runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Format, lint and knip need no build output, so they run beside the main
  # job rather than in front of it. A shallow checkout is enough here.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format Check
        run: pnpm run format:check
      - name: Lint
        run: pnpm run lint
      - name: Knip
        run: pnpm run knip

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # SonarCloud reads the history to attribute code to commits.
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # Not covered by the build above. `tsconfig.build.json` per package covers
      # `src/`; this covers `test/`, which is where a type error would otherwise
      # survive until someone ran the full gate by hand.
      #
      # It was missing entirely, and the release workflow found it: `pnpm check`
      # failed on a clean checkout with TS6305 in 60 files, because the test
      # project reads the packages through their declaration output and nothing
      # had built it. Locally it passed, because a developer always has `dist`.
      - name: Typecheck
        run: pnpm run typecheck

      - name: API Extractor Check
        run: pnpm run api-extractor:ci

      # `pnpm test` would rebuild through its `pretest` hook. The build above
      # already produced `dist`, so vitest runs directly instead.
      - name: Test and Coverage
        run: pnpm exec vitest run --coverage

      # The root `check:package` rebuilds, and the build above already ran. Each
      # package's own script does not rebuild, so this calls those directly.
      # Every package packs into its own `temp/`, which is what keeps the
      # tarball globs apart: `tsp-asyncapi-core-0.4.0.tgz` matches
      # `tsp-asyncapi-*.tgz` too.
      - name: Package Check
        run: pnpm -r check:package

      # Blocking. A vulnerability in a production dependency reaches every
      # consumer of the published package, so it fails the build.
      #
      # `--ignore-registry-errors` keeps a registry outage from failing the
      # build, which is what pnpm documents the flag for. A found
      # vulnerability still fails; only a report that never arrived passes.
      #
      # It is needed. On 2026-09-04 this step failed a push that had changed
      # no dependency: npm's advisory endpoint,
      # `/-/npm/v1/security/advisories/bulk`, accepted the connection and
      # never answered, through two retries and four minutes. The registry
      # itself answered in 0.14s at the same moment, a one-package payload
      # timed out the same way, and status.npmjs.org called Security Audit
      # operational throughout. So the outage is not observable from here and
      # not something a push can fix or wait out.
      #
      # `timeout-minutes` bounds the wait. pnpm retries twice with a growing
      # backoff, so an unanswered endpoint costs four minutes of a runner
      # before it gives up on its own.
      - name: Audit production dependencies
        timeout-minutes: 3
        run: pnpm audit --prod --ignore-registry-errors

      # Reporting only. Development vulnerabilities do not reach consumers,
      # and some have no fixed version to move to, so a failure here would
      # block work that cannot fix it. Dependabot raises the pull requests.
      - name: Audit all dependencies (report only)
        timeout-minutes: 3
        run: pnpm audit || true

      # Only on a push to the main branch. This organisation is on the free
      # SonarCloud plan, which cannot read data from any branch other than
      # the main one, so a scan of a pull request uploads a report that
      # nobody can open. It costs about a minute per run.
      - name: SonarCloud Scan
        if: github.event_name == 'push'
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # The docs site is published by `.github/workflows/docs.yml`. It used to
  # hang off this job, which meant an advisory-endpoint outage blocked a
  # deploy that had nothing to do with dependencies.
