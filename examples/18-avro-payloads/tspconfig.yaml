# This example runs two emitters over one source. The AsyncAPI document and
# the `.avsc` files are both written from the same models.
emit:
  - "tsp-asyncapi"
  - "tsp-avro"

options:
  "tsp-asyncapi":
    # Where the emitted file is written. The default buries it in
    # `tsp-output/tsp-asyncapi/`. `{project-root}` puts it next to
    # `main.tsp`, so the one file a reader came to see is in plain sight.
    emitter-output-dir: "{project-root}"
    # `yaml` or `json`. The default is `yaml`.
    file-type: "yaml"
    # The name of the emitted file. The default is `asyncapi.yaml` or
    # `asyncapi.json`, depending on `file-type`.
    output-file: "asyncapi.yaml"
    # Turns the Avro preview feature on. Without this line the models below
    # lower to JSON Schema, and the `tsp-avro` decorators change nothing in
    # the AsyncAPI document.
    preview-features: ["avro"]
  "tsp-avro":
    # The Avro emitter writes one file per record. The Avro namespace decides
    # the rest of the path, so `com.example.orders` becomes
    # `com/example/orders/`.
    emitter-output-dir: "{project-root}/schemas"

# Turns on the recommended lint rules. One of them,
# `avro-content-type-undeclared`, only runs when the Avro preview feature is
# on. It reports a message whose `@contentType` says Avro while nothing gives
# it an Avro payload.
linter:
  extends:
    - "tsp-asyncapi/recommended"
