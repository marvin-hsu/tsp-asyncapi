asyncapi: 3.1.0
info:
  title: Orders Service
  version: 1.0.0
  description: Order events, carried as protobuf on Kafka.
channels:
  orders.placed:
    address: orders.placed
    messages:
      OrderPlaced:
        $ref: "#/components/messages/OrderPlaced"
  orders.shipped:
    address: orders.shipped
    messages:
      OrderShipped:
        $ref: "#/components/messages/OrderShipped"
operations:
  placed:
    action: send
    channel:
      $ref: "#/channels/orders.placed"
    messages:
      - $ref: "#/channels/orders.placed/messages/OrderPlaced"
  shipped:
    action: send
    channel:
      $ref: "#/channels/orders.shipped"
    messages:
      - $ref: "#/channels/orders.shipped/messages/OrderShipped"
components:
  schemas:
    OrderPlacedPayload:
      schemaFormat: application/vnd.google.protobuf;version=3
      schema: |
        // Generated by Microsoft TypeSpec

        syntax = "proto3";

        package com.example.orders;

        // One order a customer placed.
        message OrderPlaced {
          string orderId = 1;
          int32 amountCents = 2;
        }

        // One order that left the warehouse.
        message OrderShipped {
          string orderId = 1;
          string carrier = 2;
        }
  messages:
    OrderPlaced:
      name: OrderPlaced
      description: One order a customer placed.
      payload:
        $ref: "#/components/schemas/OrderPlacedPayload"
    OrderShipped:
      name: OrderShipped
      description: One order that left the warehouse.
      payload:
        $ref: "#/components/schemas/OrderPlacedPayload"
