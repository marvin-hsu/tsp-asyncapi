asyncapi: 3.1.0
info:
  title: Orders Service
  version: 1.0.0
  description: Order and billing events, carried as protobuf over RabbitMQ.
servers:
  production:
    host: rabbit.example.com:5672
    protocol: amqp
    title: RabbitMQ
    description: The production broker. Publishing needs the orders vhost.
channels:
  order.placed:
    address: order.placed
    messages:
      OrderPlaced:
        $ref: "#/components/messages/OrderPlaced"
    bindings:
      $ref: "#/components/channelBindings/Placed"
  order.shipped:
    address: order.shipped
    messages:
      OrderShipped:
        $ref: "#/components/messages/OrderShipped"
    bindings:
      $ref: "#/components/channelBindings/Placed"
  invoice.issued:
    address: invoice.issued
    messages:
      InvoiceIssued:
        $ref: "#/components/messages/InvoiceIssued"
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: billing
          type: topic
          durable: true
          vhost: /orders
        bindingVersion: 0.3.0
operations:
  placed:
    action: send
    channel:
      $ref: "#/channels/order.placed"
    bindings:
      amqp:
        deliveryMode: 2
        mandatory: true
        timestamp: true
        bindingVersion: 0.3.0
    messages:
      - $ref: "#/channels/order.placed/messages/OrderPlaced"
  shipped:
    action: send
    channel:
      $ref: "#/channels/order.shipped"
    bindings:
      amqp:
        deliveryMode: 2
        timestamp: true
        bindingVersion: 0.3.0
    messages:
      - $ref: "#/channels/order.shipped/messages/OrderShipped"
  issued:
    action: send
    channel:
      $ref: "#/channels/invoice.issued"
    bindings:
      amqp:
        deliveryMode: 2
        bindingVersion: 0.3.0
    messages:
      - $ref: "#/channels/invoice.issued/messages/InvoiceIssued"
components:
  messages:
    OrderPlaced:
      name: OrderPlaced
      description: One order a customer placed.
      payload:
        schemaFormat: application/vnd.google.protobuf;version=3
        schema: |
          syntax = "proto3";

          package com.example.orders;

          // One order a customer placed.
          message OrderPlaced {
            string orderId = 1;
            Money total = 2;
          }

          // An amount of money, as the smallest unit of one currency.
          message Money {
            string currency = 1;
            int64 amount = 2;
          }
      examples:
        - name: typical-order
          summary: One order, paid in TWD.
          payload:
            orderId: ord-1001
            total:
              currency: TWD
              amount: 249000
    OrderShipped:
      name: OrderShipped
      description: One order that left the warehouse.
      payload:
        schemaFormat: application/vnd.google.protobuf;version=3
        schema: |
          syntax = "proto3";

          package com.example.orders;

          // One order that left the warehouse.
          message OrderShipped {
            string orderId = 1;
            string carrier = 2;
          }
      examples:
        - name: shipped-order
          payload:
            orderId: ord-1001
            carrier: black-cat
    InvoiceIssued:
      name: InvoiceIssued
      description: One invoice issued for an order.
      payload:
        schemaFormat: application/vnd.google.protobuf;version=3
        schema: |
          syntax = "proto3";

          package com.example.billing;

          // One invoice issued for an order.
          message InvoiceIssued {
            string invoiceId = 1;
            string orderId = 2;
            int64 amountCents = 3;
          }
      examples:
        - name: issued-invoice
          payload:
            invoiceId: inv-31
            orderId: ord-1001
            amountCents: 249000
  channelBindings:
    Placed:
      amqp:
        is: routingKey
        exchange:
          name: orders
          type: topic
          durable: true
          vhost: /orders
        bindingVersion: 0.3.0
