# Every example in this directory reuses this configuration.
# `emit` names the emitter. The name is the package name in `package.json`.
emit:
  - "tsp-asyncapi"

options:
  "tsp-asyncapi":
    # Where the emitted file is written. The default buries it in
    # `tsp-output/tsp-asyncapi/`. `{project-root}` puts it next to
    # `main.tsp`, so the one file a reader came to see is in plain sight.
    emitter-output-dir: "{project-root}"
    # `yaml` or `json`. The default is `yaml`.
    file-type: "yaml"
    # The name of the emitted file. The default is `asyncapi.yaml` or
    # `asyncapi.json`, depending on `file-type`.
    output-file: "asyncapi.yaml"
    # Becomes `defaultContentType` in the document. It applies to every
    # message that sets no `@contentType` of its own.
    default-content-type: "application/json"
    # Becomes `id` in the document. It identifies the application.
    asyncapi-id: "urn:example:hello-service"

# Turns on the recommended lint rules. They warn about mistakes the emitter
# accepts, such as a missing `@service`. A rule runs during semantic
# analysis, so an editor shows it without running the emitter.
linter:
  extends:
    - "tsp-asyncapi/recommended"
